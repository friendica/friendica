matrix:
  include:
    - PHP_MAJOR_VERSION: 8.5
      PHP_VERSION: 8.5.6

labels:
  location: opensocial

when:
  branch:
    exclude: [ stable ]
  event: [ pull_request, push ]

steps:
  restore_cache:
    image: meltwater/drone-cache:dev
    settings:
      backend: filesystem
      restore: true
      cache_key: "{{ .Repo.Name }}_php${PHP_MAJOR_VERSION}_{{ arch }}_{{ os }}"
      archive_format: gzip
      mount:
        - ".composer"
    volumes:
      - /tmp/drone-cache:/tmp/cache

  composer_install:
    image: friendicaci/php${PHP_MAJOR_VERSION}:php${PHP_VERSION}
    commands:
      - git clone -b develop --single-branch https://git.friendi.ca/friendica/friendica-addons.git addon
      - export COMPOSER_HOME=.composer
      - ./bin/composer.phar validate
      - ./bin/composer.phar install --prefer-dist
    volumes:
      - /etc/hosts:/etc/hosts

  rebuild_cache:
    image: meltwater/drone-cache:dev
    settings:
      backend: filesystem
      rebuild: true
      cache_key: "{{ .Repo.Name }}_php${PHP_MAJOR_VERSION}_{{ arch }}_{{ os }}"
      archive_format: gzip
      mount:
        - ".composer"
    volumes:
      - /tmp/drone-cache:/tmp/cache

  db_bootstrap:
    image: friendicaci/php${PHP_MAJOR_VERSION}:php${PHP_VERSION}
    environment:
      MYSQL_HOST: mariadb
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: test
      MYSQL_PASSWORD: test
      MYSQL_USER: test
    commands:
      - cp config/local-sample.config.php config/local.config.php
      - bin/wait-for-connection $MYSQL_HOST $MYSQL_PORT 300
      - mysql -h$MYSQL_HOST -P$MYSQL_PORT -p$MYSQL_PASSWORD -u$MYSQL_USER $MYSQL_DATABASE < database.sql

  # --- Detached: Friendica ExtAuth Sidecar (öffnet TCP:9000 und startet Console-Daemon) ---
  friendica_extauth:
    image: php:${PHP_MAJOR_VERSION}-alpine
    detach: true
    depends_on:
      - composer_install
      - db_bootstrap
    commands:
      - apk add --no-cache socat
      - |
        set -e
        CMD="auth_ejabberd"
        echo "Starting ExtAuth daemon command: $CMD"
        exec socat TCP-LISTEN:9000,reuseaddr,fork,nodelay,keepalive,so-keepalive=1 \
             EXEC:"php ./bin/console $CMD",setsid

  # --- Detached: ejabberd with external auth + HTTP API ---
  ejabberd:
    image: ghcr.io/processone/ejabberd:25.08
    detach: true
    depends_on:
      - friendica_extauth
    commands:
      - |
        set -e
        EXTAUTH_HOST=friendica_extauth
        until EXTAUTH_IP=$(getent hosts "$EXTAUTH_HOST" | awk '{print $1}'); do
          echo "waiting for $EXTAUTH_HOST DNS..."
          sleep 0.5
        done
        echo "extauth at $EXTAUTH_IP:9000"

        mkdir -p /home/ejabberd/conf
        cat > /home/ejabberd/conf/ejabberd.yml <<EOF
        hosts:
          - xmpp.test

        auth_method:
          - external
        extauth_program: "/bin/sh -lc 'exec /bin/busybox nc $EXTAUTH_IP 9000'"
        extauth_pool_size: 5
        auth_use_cache: false

        loglevel: 5

        listen:
          - port: 5222
            module: ejabberd_c2s
            starttls_required: false
          - port: 5281
            module: ejabberd_http
            request_handlers:
              /api: mod_http_api

        modules:
          mod_http_api: {}
          mod_admin_extra: {}

        api_permissions:
          "ci-open-api":
            from:
              - mod_http_api
            who:
              ip: 0.0.0.0/0
            what:
              - "*"
        EOF
      - exec /home/ejabberd/bin/ejabberdctl foreground

  e2e_check_password:
    image: friendicaci/php${PHP_MAJOR_VERSION}:php${PHP_VERSION}
    depends_on:
      - ejabberd
    commands:
      - sleep 10
      - set -e
      - apt-get update && apt-get install -y curl
      - php ./bin/console user add ciuser CI ciuser@example.test en || true
      - php ./bin/console user password CI sehrgeheim
      - |
        EJ="http://ejabberd:5281/api"
        ok=0
        code=$(curl -sS -X POST \
                 -H "Content-Type: application/json" \
                 -H "Host: xmpp.test" \
                 --data-binary "{\"user\":\"CI\",\"host\":\"xmpp.test\",\"password\":\"sehrgeheim\"}" "$EJ/check_password" \
                 -D /tmp/h.txt -o /tmp/b.txt -w '%{http_code}')
        echo "[try] POST /api/check_password → HTTP $code ; body: $(cat /tmp/b.txt || true)"
        [ "$code" = "200" ] && ok=1
        if [ "$ok" -ne 1 ]; then
          echo "--- headers ---"; cat /tmp/h.txt || true
          echo "--- body ---";    cat /tmp/b.txt || true
          exit 1
        fi
        echo "E2E OK"

  lock_race_same_domain:
    image: friendicaci/php${PHP_MAJOR_VERSION}:php${PHP_VERSION}
    depends_on:
#      - e2e_check_password
      - ejabberd
    commands:
      - sleep 10
      - set -e
      - apt-get update && apt-get install -y curl coreutils
      - php ./bin/console lock set "ex_auth_host:xmpp.test" || true
      - |
        locks=$(php ./bin/console lock list)
        echo "$locks" || true
      - |
        EJ="http://ejabberd:5281/api"
        ok=0
        code=$(curl -sS -X POST \
                 -H "Content-Type: application/json" \
                 -H "Host: xmpp.test" \
                 --data-binary "{\"user\":\"CI\",\"host\":\"xmpp.test\",\"password\":\"sehrgeheim\"}" "$EJ/check_password" \
                 -D /tmp/h.txt -o /tmp/b.txt -w '%{http_code}')
        echo "[try] POST /api/check_password → HTTP $code ; body: $(cat /tmp/b.txt || true)"
        [ "$code" = "200" ] && ok=1
        if [ "$ok" -ne 1 ]; then
          echo "--- headers ---"; cat /tmp/h.txt || true
          echo "--- body ---";    cat /tmp/b.txt || true
          exit 1
        fi
        echo "E2E NOK"

services:
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_DATABASE: test
      MYSQL_PASSWORD: test
      MYSQL_USER: test
