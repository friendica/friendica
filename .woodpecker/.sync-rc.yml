# After each push to a *-rc branch, updates the branch "merge-<rc>-into-develop" (develop with <rc> merged in,
# keeping the version of develop) and opens a PR for it, unless one is already open.
# An open PR is extended in place, so conflicts resolved there stay resolved.
# A merge conflict marks that PR as WIP with a failed "sync-rc" status and a comment, or opens an issue if no PR is open.
# The same conflict is reported only once.
# Runs at the releaser location because it needs a token with write access
labels:
  location: friendica
  type: releaser

when:
  repo: friendica/friendica
  branch: '*-rc'
  event: push

steps:
  open_sync_pr:
    image: friendicaci/php8.5:php8.5.5
    # A sync needing manual work must not mark the rc push as failed
    failure: ignore
    environment:
      TOKEN:
        from_secret: sync_token
    commands:
      - apt-get update -qq && apt-get install -qq -y jq > /dev/null
      - SCRIPT="$(pwd)/bin/dev/sync-rc-into-develop.sh"
      - SYNC_BRANCH="merge-${CI_COMMIT_BRANCH}-into-develop"
      - TITLE="Merge ${CI_COMMIT_BRANCH} into develop"
      - if [ "${CI_FORGE_TYPE}" = "github" ]; then
          API_ROOT="https://api.github.com";
          PR_HEAD="${CI_REPO_OWNER}:$${SYNC_BRANCH}";
        else
          API_ROOT="${CI_FORGE_URL}/api/v1";
          PR_HEAD="$${SYNC_BRANCH}";
        fi
      - API="$${API_ROOT}/repos/${CI_REPO}"
      - FORGE_URL="${CI_FORGE_URL}"
      - |
        api() {
          curl -sS --fail-with-body -H "Authorization: token $${TOKEN}" -H "Content-Type: application/json" "$$@"
        }
      # $1 = state, $2 = description (max. 140 characters), $3 = commit
      - |
        set_status() {
          jq -n --arg state "$$1" --arg description "$$2" --arg url "${CI_PIPELINE_URL}" \
            '{state: $$state, context: "sync-rc", description: $$description, target_url: $$url}' > /tmp/status.json
          api -o /dev/null -X POST -d @/tmp/status.json "$${API}/statuses/$$3"
        }
      - |
        set_title() {
          jq -n --arg title "$$1" '{title: $$title}' > /tmp/title.json
          api -o /dev/null -X PATCH -d @/tmp/title.json "$${API}/pulls/$${PR_NUMBER}"
        }
      - LOGIN="$(api "$${API_ROOT}/user")" || { echo "$${LOGIN}"; exit 1; }
      - LOGIN="$(printf '%s\n' "$${LOGIN}" | jq -r .login)"
      - git clone --quiet --filter=blob:none --single-branch --branch develop "${CI_FORGE_URL}/${CI_REPO}.git" /tmp/sync
      - cd /tmp/sync
      - git fetch --quiet origin "${CI_COMMIT_BRANCH}:refs/remotes/origin/${CI_COMMIT_BRANCH}"
      - git config user.name "$${LOGIN}"
      - git config user.email "no-reply@friendi.ca"
      - PULLS="$(api "$${API}/pulls?state=open&base=develop&head=$${PR_HEAD}")" || { echo "$${PULLS}"; exit 1; }
      - PR_NUMBER="$(printf '%s\n' "$${PULLS}" | jq -r '.[0].number // empty')"
      - PR_TITLE="$(printf '%s\n' "$${PULLS}" | jq -r '.[0].title // empty')"
      # Build on the open sync PR, so conflicts resolved there stay resolved
      - START="origin/develop"
      - |
        if [ -n "$${PR_NUMBER}" ]; then
          git fetch --quiet origin "$${SYNC_BRANCH}:refs/remotes/origin/$${SYNC_BRANCH}"
          START="origin/$${SYNC_BRANCH}"
        fi
      - RESULT=0
      - OUTPUT="$(sh "$${SCRIPT}" "${CI_COMMIT_BRANCH}" origin "$${START}" 2>&1)" || RESULT=$$?
      - printf '%s\n' "$${OUTPUT}"
      # The PR already contains the rc branch, e.g. after a manual resolution: clear the conflict mark
      - |
        if [ "$${RESULT}" -eq 3 ]; then
          if [ -n "$${PR_NUMBER}" ] && [ "$${PR_TITLE}" != "$${TITLE}" ]; then
            set_status success "Contains ${CI_COMMIT_BRANCH} up to ${CI_COMMIT_SHA}" "$(git rev-parse "$${START}")"
            set_title "$${TITLE}"
          fi
          exit 0
        fi
      # On a conflict, mark the sync PR and ask for a manual merge there (or in an issue, if no PR is open)
      - |
        if [ "$${RESULT}" -ne 0 ]; then
          REASON="$(printf '%s\n' "$${OUTPUT}" | grep -m1 'resolve the sync manually' || echo "see ${CI_PIPELINE_URL}")"
          START_SHA="$(git rev-parse "$${START}")"
          if [ -n "$${PR_NUMBER}" ]; then
            SYNCED="$(git merge-base "$${START}" "origin/${CI_COMMIT_BRANCH}")"
            STATE="This PR is not up to date: it contains \`${CI_COMMIT_BRANCH}\` up to $${SYNCED}, merging the newer commits up to ${CI_COMMIT_SHA} needs manual work. $${REASON}"
            MARKER="<!-- sync-rc $${START_SHA} $${REASON} -->"
            set_status failure "Newer ${CI_COMMIT_BRANCH} commits conflict with develop, see the PR comments" "$${START_SHA}"
            if [ "$${PR_TITLE}" != "WIP: $${TITLE}" ]; then set_title "WIP: $${TITLE}"; fi
          else
            STATE="Merging \`${CI_COMMIT_BRANCH}\` (${CI_COMMIT_SHA}) into \`develop\` needs manual work: $${REASON}"
            MARKER="<!-- sync-rc $${REASON} -->"
          fi
          jq -n --arg title "$${TITLE} needs manual resolution" --arg state "$${STATE}" --arg marker "$${MARKER}" \
            --arg branch "$${SYNC_BRANCH}" --arg start "$${START}" --arg rc "${CI_COMMIT_BRANCH}" \
            '{title: $$title,
            body: "\($$state)\n\n```sh\ngit fetch origin\ngit checkout -B \($$branch) \($$start)\ngit merge --no-ff origin/\($$rc)\n# resolve the conflicts, keep the version of develop\ngit push origin \($$branch)\n```\n\n\($$marker)"}' \
            > /tmp/notice.json
          SEEN=""
          if [ -z "$${PR_NUMBER}" ]; then
            # creator and per_page are GitHub parameters, created_by and limit their Forgejo counterparts
            QUERY="state=open&creator=$${LOGIN}&per_page=100&created_by=$${LOGIN}&limit=50"
            ISSUES="$(api "$${API}/issues?$${QUERY}")" || { echo "$${ISSUES}"; exit 1; }
            ISSUE="$(printf '%s\n' "$${ISSUES}" | jq -c --slurpfile n /tmp/notice.json \
              'map(select(.pull_request == null and .title == $$n[0].title)) | .[0] // empty')"
            if [ -z "$${ISSUE}" ]; then
              api -o /dev/null -X POST -d @/tmp/notice.json "$${API}/issues"
              exit 0
            fi
            PR_NUMBER="$(printf '%s\n' "$${ISSUE}" | jq -r .number)"
            SEEN="$(printf '%s\n' "$${ISSUE}" | jq -r --arg m "$${MARKER}" 'select(.body // "" | contains($$m)) | .number')"
          fi
          if [ -z "$${SEEN}" ]; then
            COMMENTS="$(api "$${API}/issues/$${PR_NUMBER}/comments?per_page=100")" || { echo "$${COMMENTS}"; exit 1; }
            SEEN="$(printf '%s\n' "$${COMMENTS}" | jq -r --arg m "$${MARKER}" 'map(select(.body | contains($$m))) | .[0].id // empty')"
          fi
          if [ -n "$${SEEN}" ]; then
            echo "Conflict already reported in #$${PR_NUMBER}"
            exit 0
          fi
          api -o /dev/null -X POST -d @/tmp/notice.json "$${API}/issues/$${PR_NUMBER}/comments"
          exit 0
        fi
      # An open PR is only extended, so it needs no force push
      - FORCE="--force"
      - if [ -n "$${PR_NUMBER}" ]; then FORCE=""; fi
      - git push --quiet $${FORCE} "https://$${LOGIN}:$${TOKEN}@$${FORGE_URL#https://}/${CI_REPO}.git" "$${SYNC_BRANCH}"
      - |
        if [ -n "$${PR_NUMBER}" ]; then
          set_status success "Contains ${CI_COMMIT_BRANCH} up to ${CI_COMMIT_SHA}" "$(git rev-parse HEAD)"
          if [ "$${PR_TITLE}" != "$${TITLE}" ]; then set_title "$${TITLE}"; fi
          echo "Sync PR already open, branch updated"
          exit 0
        fi
      - >-
        jq -n --arg head "$${SYNC_BRANCH}" --arg rc "${CI_COMMIT_BRANCH}" --arg title "$${TITLE}"
        '{base: "develop", head: $$head, title: $$title,
        body: "Merges `\($$rc)` into `develop`. Keeps the version of `develop` in VERSION, database.sql, src/App.php and view/lang/C/messages.po.\n\nUpdated by the sync-rc pipeline after each push to `\($$rc)`."}'
        > /tmp/pr.json
      - api -o /dev/null -X POST -d @/tmp/pr.json "$${API}/pulls"
