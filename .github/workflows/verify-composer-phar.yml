name: Verify composer.phar

on:
  pull_request:
    paths:
      - 'bin/composer.phar'
      - 'bin/dev/verify-composer-phar.sh'
      - 'bin/dev/composer-signing-key.asc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bin/dev/verify-composer-phar.sh
