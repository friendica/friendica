name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  code-style:
    name: PHP-CS-Fixer (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup PHP with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Clone addon repository
        run: git clone -b develop --single-branch https://git.friendi.ca/friendica/friendica-addons.git addon

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Cache PHP-CS-Fixer results
        uses: actions/cache@v4
        with:
          path: .php-cs-fixer.cache
          key: php-cs-fixer-${{ matrix.php }}-${{ github.sha }}
          restore-keys: php-cs-fixer-${{ matrix.php }}-

      - name: Run PHP-CS-Fixer
        continue-on-error: true
        run: vendor/bin/php-cs-fixer fix --diff --dry-run

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup PHP with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Clone addon repository
        run: git clone -b develop --single-branch https://git.friendi.ca/friendica/friendica-addons.git addon

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Cache PHPStan results
        uses: actions/cache@v4
        with:
          path: /tmp/phpstan
          key: phpstan-${{ matrix.php }}-${{ github.sha }}
          restore-keys: phpstan-${{ matrix.php }}-

      - name: Run PHPStan
        run: composer run phpstan

  phpstan-addons:
    name: PHPStan in addons (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup PHP with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Clone addon repository
        run: git clone -b develop --single-branch https://git.friendi.ca/friendica/friendica-addons.git addon

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Cache PHPStan results
        uses: actions/cache@v4
        with:
          path: /tmp/phpstan
          key: phpstan-addons-${{ matrix.php }}-${{ github.sha }}
          restore-keys: phpstan-addons-${{ matrix.php }}-

      # Non-blocking: friendica-addons lives on git.friendi.ca and has no CI of its own,
      # so faulty addon code only surfaces here, after it was merged - turning this
      # repository's pipeline red for changes that aren't ours. The findings stay
      # visible in the log, the annotations and the job summary below.
      - name: Run PHPStan in addons
        id: phpstan_addons
        continue-on-error: true
        run: 'composer run addons:phpstan'

      - name: Report addon PHPStan findings
        if: steps.phpstan_addons.outcome == 'failure'
        run: |
          {
            echo '### :warning: PHPStan found errors in friendica-addons'
            echo
            echo 'These come from the addon repository on git.friendi.ca, not from this pull request,'
            echo 'so they do not fail this workflow. See the "Run PHPStan in addons" step for details.'
          } >> "$GITHUB_STEP_SUMMARY"

  rector:
    name: Rector (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup PHP with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Clone addon repository
        run: git clone -b develop --single-branch https://git.friendi.ca/friendica/friendica-addons.git addon

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Cache Rector results
        uses: actions/cache@v4
        with:
          path: /tmp/rector_cached_files
          key: rector-${{ matrix.php }}-${{ github.sha }}
          restore-keys: rector-${{ matrix.php }}-

      - name: Run Rector
        run: composer run rector:check

  phpmd:
    name: PHPMD (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup PHP with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Clone addon repository
        run: git clone -b develop --single-branch https://git.friendi.ca/friendica/friendica-addons.git addon

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Cache PHPMD results
        uses: actions/cache@v4
        with:
          path: .phpmd.result-cache.php
          key: phpmd-${{ matrix.php }}-${{ github.sha }}
          restore-keys: phpmd-${{ matrix.php }}-

      - name: Run PHPMD
        run: vendor/bin/phpmd src/ text .phpmd-ruleset.xml --color --cache

  eslint:
    name: ESLint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        node: ['24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js

  stylelint:
    name: Stylelint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        node: ['24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Stylelint
        run: npm run lint:css
