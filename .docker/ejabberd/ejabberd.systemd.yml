# ejabberd config for the CROSS-HOST model (systemd socket activation).
#
# Architecture (ejabberd and Friendica on different hosts):
#   ejabberd → socat STDIO TCP:9000 → systemd-socket-activate (Friendica host)
#                                       → php bin/console.php auth_ejabberd
#
# ejabberd spawns `socat STDIO TCP:...` via Erlang open_port (no shell, no PATH). socat is a
# thin relay only — it does NOT manage the auth daemon. On the Friendica host the daemon is
# launched per-connection by systemd socket activation (here: the friendica-extauth service
# running systemd-socket-activate; in production: a friendica-extauth.socket + @.service unit).
#
# The vhost "localhost" must match Friendica's SERVER_NAME (.docker/.dist.env).

hosts:
  - "localhost"

loglevel: info

listen:
  - port: 5222
    module: ejabberd_c2s
    starttls_required: false

  - port: 5281
    module: ejabberd_http
    request_handlers:
      /api: mod_http_api

auth_method:
  - external
# Full path required: ejabberd spawns via Erlang open_port without a shell or PATH.
# socat relays stdin/stdout over TCP to the systemd-activated daemon on the Friendica host.
extauth_program: "/usr/bin/socat STDIO TCP:friendica-extauth:9000"
extauth_pool_size: 3
# Friendica supports per-account XMPP application passwords; ejabberd's auth cache would
# silently break them, so it must stay disabled.
auth_use_cache: false

modules:
  mod_adhoc: {}
  mod_admin_extra: {}
  mod_caps: {}
  mod_carboncopy: {}
  mod_client_state: {}
  mod_configure: {}
  mod_disco: {}
  mod_http_api: {}
  mod_last: {}
  mod_mam:
    default: always
  mod_ping: {}
  mod_roster: {}
  mod_stream_mgmt: {}
  mod_version:
    show_os: false

acl:
  local:
    user_regexp: ""

access_rules:
  c2s:
    deny: blocked
    allow: all
  # Account creation happens in Friendica, not via XMPP registration.
  register:
    deny: all

# Open HTTP API for local integration testing (check_password etc.).
api_permissions:
  "local":
    from:
      - mod_http_api
    who:
      ip: 0.0.0.0/0
    what:
      - "*"

shaper:
  normal:
    rate: 3000
    burst_size: 20000
  fast: 100000

shaper_rules:
  max_user_sessions: 10
  c2s_shaper:
    none: admin
    normal: all